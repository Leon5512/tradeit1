<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Создать группу · TradeIt MSN</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f0f1a;--card:#1a1a2e;--card2:#16213e;--primary:#6c47ff;--primary2:#00aeef;--accent:#ff6a00;--text:#e8eaf6;--muted:#7a8ba0;--border:#2a2a4a;--error:#ef4444;--radius:14px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

  .header{background:var(--card);border-bottom:2px solid var(--primary);padding:0 20px;height:56px;display:flex;align-items:center;gap:12px;}
  .back{color:var(--muted);text-decoration:none;font-size:20px;}
  .back:hover{color:var(--text);}
  .header h1{font-size:18px;font-weight:800;}

  .wrap{max-width:480px;margin:40px auto;padding:0 20px;width:100%;}

  .form-card{background:var(--card);border-radius:20px;padding:36px;border:1px solid var(--border);}
  .form-card h2{font-size:22px;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#ff6a00,#6c47ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .form-card p{color:var(--muted);font-size:14px;margin-bottom:28px;}

  .form-group{margin-bottom:20px;}
  label{display:block;font-weight:700;font-size:13px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
  input[type=text]{width:100%;background:var(--card2);border:2px solid var(--border);border-radius:var(--radius);padding:12px 16px;color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:.15s;}
  input[type=text]:focus{border-color:var(--primary);}
  input[type=text]::placeholder{color:var(--muted);}

  .avatar-preview{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ff6a00,var(--primary));display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;position:relative;cursor:pointer;overflow:hidden;}
  .avatar-preview img{width:100%;height:100%;object-fit:cover;}
  .avatar-preview .overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:20px;opacity:0;transition:.15s;}
  .avatar-preview:hover .overlay{opacity:1;}

  .submit-btn{width:100%;background:linear-gradient(135deg,#ff6a00,var(--primary));border:none;border-radius:var(--radius);padding:14px;color:white;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;transition:.15s;margin-top:4px;}
  .submit-btn:hover{opacity:.88;}

  .flash{background:var(--error);color:white;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;margin-bottom:16px;}
</style>
</head>
<body>

<div class="header">
  <a href="/messenger" class="back">←</a>
  <h1>👥 Создать группу</h1>
</div>

<div class="wrap">
  <div class="form-card">
    {% with messages = get_flashed_messages(with_categories=True) %}
      {% for cat, msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
    {% endwith %}

    <div style="text-align:center;">
      <div class="avatar-preview" id="av-preview">
        <span id="av-icon">👥</span>
        <div class="overlay">📷</div>
      </div>
    </div>

    <h2>Новая группа</h2>
    <p>После создания ты сможешь пригласить участников по их #номеру.</p>

    <form method="post">
      <div class="form-group">
        <label>Название группы</label>
        <input type="text" name="name" placeholder="Например: Команда проекта" minlength="2" maxlength="50" required autofocus>
      </div>
      <button type="submit" class="submit-btn">🚀 Создать группу</button>
    </form>
  </div>
</div>

<script>
// Live preview of group name as avatar letter
document.querySelector('input[name=name]').addEventListener('input', function() {
  const icon = document.getElementById('av-icon');
  icon.textContent = this.value.trim() ? this.value.trim()[0].toUpperCase() : '👥';
});
</script>
</body>
</html>
