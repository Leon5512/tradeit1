{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="container" style="max-width:440px;">
  <div class="card" style="margin-top:40px;">
    <div class="page-header">
      <h1>Регистрация</h1>
      <p>Создай аккаунт и начни продавать</p>
    </div>
    <form method="post">
      <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" name="username" required placeholder="ivanov123">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="mail@example.com">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required placeholder="Минимум 6 символов" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;">
        Создать аккаунт
      </button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:14px; color:var(--muted);">
      Уже есть аккаунт? <a href="/login" style="color:var(--primary); font-weight:700;">Войти</a>
    </p>
  </div>
</div>
{% endblock %}
