{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="container" style="max-width:440px;">
  <div class="card" style="margin-top:40px;">
    <div class="page-header">
      <h1>Вход в аккаунт</h1>
      <p>Рады видеть тебя снова!</p>
    </div>
    <form method="post">
      <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" name="username" required placeholder="Твой логин">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;">
        Войти
      </button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:14px; color:var(--muted);">
      Нет аккаунта? <a href="/register" style="color:var(--primary); font-weight:700;">Зарегистрироваться</a>
    </p>
  </div>
</div>
{% endblock %}
