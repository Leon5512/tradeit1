{% extends "base.html" %}
{% block title %}Чат с {{ other.username }}{% endblock %}
{% block content %}
<div class="container" style="max-width:700px; padding-bottom:0;">
  <div style="display:flex; align-items:center; gap:12px; padding:12px 0; margin-bottom:4px;">
    <a href="/messages" style="color:var(--primary); text-decoration:none; font-weight:700;">← Назад</a>
    <div style="width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; color:white; font-weight:800;">
      {{ other.username[0].upper() }}
    </div>
    <a href="/user/{{ other.username }}" style="font-weight:800; font-size:16px; text-decoration:none; color:var(--text);">{{ other.username }}</a>
  </div>

  <div class="card" style="padding:0; display:flex; flex-direction:column; height:calc(100vh - 180px);">
    <div class="chat-msgs" id="msgs" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;"></div>

    <!-- Поле ввода -->
    <div style="display:flex;align-items:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--card);">
      <label style="cursor:pointer;font-size:20px;color:var(--muted);transition:.15s;" title="Прикрепить файл"
             onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--muted)'">
        📎
        <input type="file" id="media-input" style="display:none"
               accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.zip"
               onchange="sendMedia(this)">
      </label>
      <input type="text" id="msg-input" placeholder="Написать сообщение..."
             autocomplete="off"
             style="flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:20px;padding:10px 16px;color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:.15s;"
             onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
      <button onclick="sendMsg()" class="btn btn-primary" style="border-radius:20px;padding:10px 20px;">Отправить</button>
    </div>
  </div>

  <!-- Прогресс загрузки -->
  <div id="upload-progress" style="display:none;text-align:center;padding:8px;font-size:13px;color:var(--primary);font-weight:700;">⏳ Загрузка файла...</div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out;">
  <img id="lightbox-img" src="" style="max-width:95vw;max-height:95vh;border-radius:10px;object-fit:contain;">
</div>

<style>
.msg-wrap{position:relative;display:flex;flex-direction:column;max-width:72%;margin-bottom:4px;}
.msg-wrap.mine{align-self:flex-end;align-items:flex-end;}
.msg-wrap.theirs{align-self:flex-start;align-items:flex-start;}
.msg-bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word;}
.mine .msg-bubble{background:linear-gradient(135deg,var(--primary),var(--accent));color:white;border-bottom-right-radius:4px;}
.theirs .msg-bubble{background:var(--card);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px;}
.msg-time{font-size:11px;color:var(--muted);margin-top:3px;padding:0 4px;}
.msg-actions{display:none;position:absolute;top:-28px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3px 6px;gap:4px;z-index:10;}
.msg-wrap:hover .msg-actions{display:flex;}
.msg-wrap.mine .msg-actions{right:0;}
.msg-wrap.theirs .msg-actions{left:0;}
.del-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;color:var(--muted);transition:.15s;}
.del-btn:hover{background:#fee2e2;color:#ef4444;}
.msg-media{max-width:220px;max-height:220px;border-radius:10px;object-fit:cover;display:block;cursor:pointer;}
.msg-file-link{display:flex;align-items:center;gap:6px;color:inherit;text-decoration:none;font-size:13px;font-weight:700;}
.msg-file-link:hover{opacity:.8;}
</style>

<script>
const MY_ID    = {{ session.user_id }};
const OTHER_ID = {{ other.id }};

const IMG_EXTS = ['jpg','jpeg','png','gif','webp'];
const VID_EXTS = ['mp4','webm','mov'];
const AUD_EXTS = ['mp3','ogg','wav','m4a'];

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function timeStr(ts){
  const d=new Date(ts*1000);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function renderMedia(text){
  const m=text.match(/^\[media\](.+)\[\/media\]$/);
  if(!m) return escHtml(text);
  const filename=m[1], ext=filename.split('.').pop().toLowerCase();
  const url=`/static/uploads/${filename}`;
  if(IMG_EXTS.includes(ext)) return `<img class="msg-media" src="${url}" onclick="openLightbox('${url}')" loading="lazy">`;
  if(VID_EXTS.includes(ext)) return `<video src="${url}" controls style="max-width:220px;border-radius:10px;"></video>`;
  if(AUD_EXTS.includes(ext)) return `<audio src="${url}" controls style="max-width:220px;margin:4px 0;"></audio>`;
  return `<a class="msg-file-link" href="${url}" download>📎 ${escHtml(filename)}</a>`;
}

function openLightbox(url){
  document.getElementById('lightbox-img').src=url;
  const lb=document.getElementById('lightbox');
  lb.style.display='flex';
}
function closeLightbox(){
  document.getElementById('lightbox').style.display='none';
}

// Удаление сообщения
async function deleteMsg(msgId){
  if(!confirm('Удалить сообщение?')) return;
  const r=await fetch(`/api/messages/delete/${msgId}`,{method:'POST'});
  const d=await r.json();
  if(d.ok){ loadMsgs(); }
  else alert(d.msg||'Ошибка');
}

let lastCount=0, isAtBottom=true;
const msgsDiv=document.getElementById('msgs');

msgsDiv.addEventListener('scroll',()=>{
  isAtBottom=msgsDiv.scrollHeight-msgsDiv.scrollTop-msgsDiv.clientHeight<40;
});

function renderMsgs(msgs){
  if(msgs.length===lastCount) return;
  lastCount=msgs.length;
  msgsDiv.innerHTML=msgs.length===0
    ?'<div style="text-align:center;color:var(--muted);padding:40px;font-size:14px;">Начни диалог первым 👋</div>'
    :msgs.map(m=>{
        const mine=m.sender_id===MY_ID;
        const deleteBtn=mine?`<button class="del-btn" onclick="deleteMsg(${m.id})" title="Удалить">🗑</button>`:'';
        return `<div class="msg-wrap ${mine?'mine':'theirs'}">
          <div class="msg-actions">${deleteBtn}</div>
          <div class="msg-bubble">${renderMedia(m.text)}</div>
          <div class="msg-time">${timeStr(m.created_at)}</div>
        </div>`;
      }).join('');
  if(isAtBottom) msgsDiv.scrollTop=msgsDiv.scrollHeight;
}

function loadMsgs(){
  fetch(`/api/messages/${OTHER_ID}`)
    .then(r=>r.json())
    .then(data=>renderMsgs(data.msgs))
    .catch(()=>{});
}

// Отправка текста
function sendMsg(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text) return;
  input.value=''; input.focus();
  fetch(`/api/send/${OTHER_ID}`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text})
  }).then(()=>{isAtBottom=true;loadMsgs();}).catch(()=>{});
}

// Отправка медиа
async function sendMedia(fileInput){
  const file=fileInput.files[0];
  if(!file) return;
  if(file.size>20*1024*1024){ alert('Файл слишком большой. Максимум 20 МБ.'); fileInput.value=''; return; }
  document.getElementById('upload-progress').style.display='block';
  const fd=new FormData();
  fd.append('file',file);
  try{
    const r=await fetch(`/api/send_media/${OTHER_ID}`,{method:'POST',body:fd});
    const d=await r.json();
    if(!d.ok) alert(d.msg||'Ошибка загрузки');
    else { isAtBottom=true; loadMsgs(); }
  }catch(e){ alert('Ошибка отправки файла'); }
  document.getElementById('upload-progress').style.display='none';
  fileInput.value='';
}

document.getElementById('msg-input').addEventListener('keydown',function(e){
  if(e.key==='Enter') { e.preventDefault(); sendMsg(); }
});

loadMsgs();
setInterval(loadMsgs,2000);
document.getElementById('msg-input').focus();
</script>
{% endblock %}
